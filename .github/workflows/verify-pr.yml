name: Verify SHILP AI Production Pipeline

on:
  push:
    branches: [ main, release/* ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Developer Sandboxes
        run: |
          python backend/sandboxes/test_anikeat_db.py
          python backend/sandboxes/test_kartik_ai.py
          python backend/sandboxes/test_ishaan_pricing.py
          python backend/sandboxes/test_jatin_channels.py

      - name: Run Master E2E System Verification
        run: |
          python backend/tests/test_e2e_suite.py
